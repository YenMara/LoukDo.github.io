<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout-Payment method</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/contact.css" />
    <link rel="stylesheet" href="../CSS/checkout.css">
     <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

  </head>
  <body>
    <header class="position-absolute top-0 start-0 w-100 z-3">
       <div id="navbar"></div>
    </header>

    <section  data-aos="fade-up"
     data-aos-anchor-placement="center-bottom">
      <div class="container mt-7 mb-5">
        <h1 class="primary-color">Checkout</h1>

       <div class="checkout-stepper mt-3">

                    <!-- Step 1 -->
                    <div class="step">
                        <a href="checkout.html" class="text-decoration-none">
                            <div class="circle">1</div>
                        <p class="fw-normal">Shipping</p>
                        </a>
                    </div>

                    <div class="line"></div>

                    <!-- Step 2 -->
                    <div class="step active">
                        <a href="checkout1.html" class="text-decoration-none ms-5">
                            <div class="circle">2</div>
                        <p class="fw-normal">Payment</p>
                        </a>
                    </div>

                    <div class="line"></div>

                    <!-- Step 3 -->
                    <div class="step">
                        <a href="checkout2.html" class="text-decoration-none ms-5">
                            <div class="circle">3</div>
                        <p class="fw-normal">Review</p>
                        </a>
                    </div>

                </div>
      </div>
    </section>



    <section  data-aos="fade-up"
     data-aos-anchor-placement="center-bottom">
      <div class="container">
        <div class="row g-3">
          <div class="col-12 col-lg-8 col-md-6">
            <div class="shadows rounded-4 p-4">
              <h2 class="primary-color mb-4">Payment Method</h2>

              <form>
                  <a href="checkout1.html" class="text-decoration-none btn btn-outline-secondary primary-color rounded-4 text-start ps-5 w-100 mt-4 payment-method" data-method="Credit/Debit Card">
                 <i class="fa-solid fa-credit-card"></i>
                  Credit/Debit Card
               </a>
                  <a href="paybyQR.html" class="text-decoration-none btn btn-outline-secondary primary-color rounded-4 text-start ps-5 w-100 mt-4 payment-method" data-method="KHQR">
                <i class="fa-solid fa-qrcode"></i>
                  KHQR
               </a>
                  <a href="cashondelivery.html" class="text-decoration-none btn btn-outline-secondary primary-color rounded-4 text-start ps-5 w-100 mt-4 payment-method" data-method="Cash on Delivery">
                <i class="fa-regular fa-money-bill-1"></i>
                  Cash on Delivery
               </a>
                     <div class="mb-3 mt-3">
                  <label for="subject" class="form-label primary-color">
                    Full Name
                  </label>
                   <input
                     type="text"
                     class="form-control"
                     id="fullname"
                     placeholder="Full Name"
                     required
                   />
                </div>
                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                    <label
                      for="exampleInputEmail1"
                      class="form-label primary-color"
                    >
                      Your Email
                    </label>
                     <input
                       type="email"
                       class="form-control"
                       id="exampleInputEmail1"
                       placeholder="Enter your email"
                       required
                     />
                  </div>
                  <div class="col-12 col-md-6 mb-3">
                    <label
                      for="exampleInputPhone"
                      class="form-label primary-color"
                    >
                      Phone
                    </label>
                     <input
                       type="tel"
                       class="form-control"
                       id="exampleInputPhone"
                       placeholder="Enter your phone"
                       required
                     />
                  </div>
                </div>

                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                    <label
                      for="exampleInputNameCard"
                      class="form-label primary-color"
                    >
                     Name on Card
                    </label>
                     <input
                       type="text"
                       class="form-control"
                       id="exampleInputNameCard"
                       placeholder="Enter your Name card"
                       required
                     />
                  </div>
                  <div class="col-12 col-md-6 mb-3">
                    <label for="province" class="form-label primary-color">
        City / Province
    </label>

     <select class="form-select" id="province" name="province" required>
         <option selected disabled>Select your city/province</option>
        <option value="Banteay Meanchey">Banteay Meanchey</option>
        <option value="Battambang">Battambang</option>
        <option value="Kampong Cham">Kampong Cham</option>
        <option value="Kampong Chhnang">Kampong Chhnang</option>
        <option value="Kampong Speu">Kampong Speu</option>
        <option value="Kampong Thom">Kampong Thom</option>
        <option value="Kampot">Kampot</option>
        <option value="Kandal">Kandal</option>
        <option value="Kep">Kep</option>
        <option value="Koh Kong">Koh Kong</option>
        <option value="Kratie">Kratie</option>
        <option value="Mondulkiri">Mondulkiri</option>
        <option value="Oddar Meanchey">Oddar Meanchey</option>
        <option value="Pailin">Pailin</option>
        <option value="Phnom Penh">Phnom Penh</option>
        <option value="Preah Sihanouk">Preah Sihanouk</option>
        <option value="Preah Vihear">Preah Vihear</option>
        <option value="Prey Veng">Prey Veng</option>
        <option value="Pursat">Pursat</option>
        <option value="Ratanakiri">Ratanakiri</option>
        <option value="Siem Reap">Siem Reap</option>
        <option value="Stung Treng">Stung Treng</option>
        <option value="Svay Rieng">Svay Rieng</option>
        <option value="Takeo">Takeo</option>
        <option value="Tboung Khmum">Tboung Khmum</option>
    </select>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="subject" class="form-label primary-color">
                    Delivery
                  </label>
                  <select class="form-select" id="delivery" name="delivery" required>
         <option selected disabled>Select devery company</option>
        <option value="Banteay Meanchey">VIT</option>
        <option value="Battambang">J&T</option>
       
     
    </select>
                </div>


              <button type="submit" class="text-decoration-none btn btn-outline-secondary-color secondary-color rounded-4 px-4 w-100 my-4">
                  Continue
              </button>
              </form>
            </div>
          </div>
          <div class="col-sm-12 col-lg-4 col-md-6">
            <div class="rounded-4 shadows p-4">

                    <h3 class="primary-color">
                        Order Summary
                    </h3>

                    <div class="d-flex justify-content-between mt-3">
                        <p class="fw-normal">Subtotal</p>
                        <h5 class="secondary-color">$40.98</h5>
                    </div>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Shipping</p>
                        <h5 class="secondary-color">$1.00</h5>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Total</p>
                        <h5 class="secondary-color">$41.98</h5>
                    </div>

            

                </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="mt-6" data-aos="fade-up"
     data-aos-anchor-placement="top-bottom">
       <div id="footer"></div>
      
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
     <script src="../JS/components.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const paymentMethods = document.querySelectorAll('.payment-method');
        paymentMethods.forEach(method => {
          method.addEventListener('click', function(e) {
            const selectedMethod = this.getAttribute('data-method');
            localStorage.setItem('loukdo-payment-method', selectedMethod);
            paymentMethods.forEach(m => m.classList.remove('active'));
            this.classList.add('active');
          });
        });

        const form = document.querySelector('form');
        if (form) {
          form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (form.checkValidity()) {
              const payment = {
                method: localStorage.getItem('loukdo-payment-method') || 'Credit/Debit Card',
                fullName: document.getElementById('fullname')?.value || '',
                email: document.getElementById('exampleInputEmail1')?.value || '',
                phone: document.getElementById('exampleInputPhone')?.value || '',
                nameOnCard: document.getElementById('exampleInputNameCard')?.value || '',
                province: document.getElementById('province')?.value || '',
                delivery: document.getElementById('delivery')?.value || ''
              };
              localStorage.setItem('loukdo-payment', JSON.stringify(payment));
              window.location.href = 'checkout2.html';
            } else {
              form.reportValidity();
            }
          });
        }
      });
    </script>

     <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
  AOS.init({
    duration: 1000,
    once: false,
    mirror: true
  });
</script>
  </body>
</html>
