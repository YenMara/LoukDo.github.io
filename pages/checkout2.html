<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Review</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/contact.css" />
    <link rel="stylesheet" href="/CSS/checkout.css">
    <link rel="stylesheet" href="/CSS/checkout2.css">
     <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

  </head>
  <body>
     <header class="position-absolute top-0 start-0 w-100 z-3">
       <div id="navbar"></div>
    </header>

    <section  data-aos="fade-up"
     data-aos-anchor-placement="center-bottom">
      <div class="container mt-7 mb-5">
        <h1 class="primary-color">Checkout</h1>

       <div class="checkout-stepper mt-3">

                    <!-- Step 1 -->
                    <div class="step">
                        <a href="checkout.html" class="text-decoration-none">
                            <div class="circle">1</div>
                        <p class="fw-normal">Shipping</p>
                        </a>
                    </div>

                    <div class="line"></div>

                    <!-- Step 2 -->
                    <div class="step">
                        <a href="checkout1.html" class="text-decoration-none ms-5">
                            <div class="circle">2</div>
                        <p class="fw-normal">Payment</p>
                        </a>
                    </div>

                    <div class="line"></div>

                    <!-- Step 3 -->
                    <div class="step active">
                        <a href="checkout2.html" class="text-decoration-none ms-5">
                            <div class="circle">3</div>
                        <p class="fw-normal">Review</p>
                        </a>
                    </div>

                </div>
      </div>
    </section>



    <section  data-aos="fade-up"
     data-aos-anchor-placement="center-bottom">
      <div class="container">
        <div class="row g-3">
          <div class="col-12 col-lg-8 col-md-6">
            <div class="shadows rounded-4 p-4">
              <h2 class="primary-color mb-4">Review Your Order</h2>

              <h5 class="primary-color">Shipping Address</h5>
              <div class="d-flex mt-3 ship-w justify-content-between">
                <h6 class="primary-color me-5">Full Name</h6>
                <p class="fw-normal" id="review-fullname"></p>
              </div>
              <div class="d-flex ship-w justify-content-between">
                <h6 class="primary-color me-5">Email</h6>
                <p class="fw-normal" id="review-email"></p>
              </div>
              <div class="d-flex ship-w justify-content-between">
                <h6 class="primary-color me-5">Phone</h6>
                <p class="fw-normal" id="review-phone"></p>
              </div>
              <div class="d-flex ship-w justify-content-between">
                <h6 class="primary-color me-5">Location</h6>
                <p class="fw-normal text-end" id="review-location"></p>
              </div>
              <div class="d-flex ship-w justify-content-between">
                <h6 class="primary-color me-5">Delivery</h6>
                <p class="fw-normal text-end" id="review-delivery"></p>
              </div>

               <h5 class="primary-color">Payment Method</h5>
              <div class="d-flex ship-w justify-content-between">
                <h6 class="primary-color me-5">Paid</h6>
                <p class="fw-normal text-end" id="review-payment"></p>
              </div>
                  
               <h5 class="primary-color">Order Items</h5>
              <div id="review-items"></div>
     


             <div class="d-flex">
               <a href="checkout1.html" class="text-decoration-none btn btn-outline-secondary text-dark rounded-4 px-4 w-25 my-4 me-2">
                  Back
                </a>
                <a href="/pages/ordersuccess.html" id="place-order-btn" type="button" class="text-decoration-none btn btn-outline-secondary-color secondary-color rounded-4 px-4 w-100 my-4">
                  Place Order
                </a>
              </div>
              
            </div>
          </div>
          <div class="col-sm-12 col-lg-4 col-md-6">
            <div class="rounded-4 shadows p-4">

                    <h3 class="primary-color">
                        Order Summary
                    </h3>

                    <div class="d-flex justify-content-between mt-3">
                        <p class="fw-normal">Subtotal</p>
                        <h5 class="secondary-color">$40.98</h5>
                    </div>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Shipping</p>
                        <h5 class="secondary-color">$1.00</h5>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Total</p>
                        <h5 class="secondary-color">$41.98</h5>
                    </div>

            

                </div>
          </div>
        </div>
      </div>
    </section>

     <footer class="mt-6" data-aos="fade-up"
     data-aos-anchor-placement="top-bottom">
       <div id="footer"></div>
      
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
     <script src="/JS/components.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const shipping = JSON.parse(localStorage.getItem('loukdo-shipping') || '{}');
        const payment = JSON.parse(localStorage.getItem('loukdo-payment') || '{}');
        const cartItems = JSON.parse(localStorage.getItem('loukdo-cart') || '[]');

        if (shipping.fullName) {
          document.getElementById('review-fullname').textContent = shipping.fullName;
          document.getElementById('review-email').textContent = shipping.email;
          document.getElementById('review-phone').textContent = shipping.phone;
          document.getElementById('review-location').textContent = shipping.address + ', ' + shipping.province;
          document.getElementById('review-delivery').textContent = shipping.delivery;
        }

        if (payment.method) {
          document.getElementById('review-payment').textContent = payment.method;
        }

        const itemsContainer = document.getElementById('review-items');
        if (itemsContainer && cartItems.length > 0) {
          let subtotal = 0;
          const markup = cartItems.map((item, index) => {
            const lineTotal = item.price * item.quantity;
            subtotal += lineTotal;
            return `
              <div class="row mt-3 g-2">
                <div class="col-3 img-cart">
                  <img src="${item.image}" alt="" class="w-100 h-100 object-fit-cover rounded-4">
                </div>
                <div class="col-9 ps-4">
                  <div class="d-flex justify-content-between">
                    <h4 class="primary-color">${item.name}</h4>
                    <p class="fw-normal primary-color">$${item.price.toFixed(2)}</p>
                  </div>
                  <p class="fw-normal primary-color">Qty: ${item.quantity}</p>
                </div>
              </div>
            `;
          }).join('');
          itemsContainer.innerHTML = markup;
        }

        const placeOrderBtn = document.getElementById('place-order-btn');
        if (placeOrderBtn) {
          placeOrderBtn.addEventListener('click', function() {
            const order = {
              shipping: shipping,
              payment: payment,
              items: cartItems,
              subtotal: '$' + cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2),
              total: '$' + (cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0) + 1).toFixed(2),
              date: new Date().toISOString()
            };

            localStorage.setItem('loukdo-last-order', JSON.stringify(order));
            localStorage.removeItem('loukdo-cart');
            localStorage.removeItem('loukdo-cart-count');
            localStorage.removeItem('loukdo-shipping');
            localStorage.removeItem('loukdo-payment');
            window.location.href = 'order.html';
          });
        }
      });
    </script>

     <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
  AOS.init({
    duration: 1000,
    once: false,
    mirror: true
  });
</script>
  </body>
</html>
