<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/order.css" />
  </head>
  <body>
     <header class="position-absolute top-0 start-0 w-100 z-3">
       <div id="navbar"></div>
    </header>


    <section>
    <div class="container section-4 mt-7">

        <h2 class="primary-color mb-4">Shopping Cart</h2>

        <div class="row g-4">

            <!-- Shopping Cart -->
            <div class="col-lg-8">

                <div class="rounded-4 shadows p-3">
                    <div id="cart-items-container"></div>
                </div>

            </div>

            <!-- Summary -->
            <div class="col-lg-4">

                <div class="rounded-4 shadows p-4">

                    <h3 class="primary-color">
                        Order Summary
                    </h3>

                    <div class="d-flex justify-content-between mt-3">
                        <p class="fw-normal">Subtotal</p>
                        <h5 id="cart-subtotal" class="secondary-color">$0.00</h5>
                    </div>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Shipping</p>
                        <h5 class="secondary-color">$1.00</h5>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Total</p>
                        <h5 id="cart-total" class="secondary-color">$0.00</h5>
                    </div>

             <a href="checkout.html" class="text-decoration-none">
                         <button
                type="submit"
                class="btn btn-outline-secondary-color secondary-color rounded-4 w-100"
            >
                Proceed to checkout
            </button>
             </a>

             <a href="products.html" class="text-decoration-none">
                <button
                type="submit"
                class="btn btn-outline-primary-color primary-color rounded-4 w-100 mt-3"
            >
               Continue Shopping
            </button>
             </a>
                      

                </div>

            </div>

        </div>

    </div>
</section>

<footer class="mt-6">
       <div id="footer"></div>
      
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/js/order.js"></script>
     <script src="/JS/components.js"></script>
  </body>
</html>
