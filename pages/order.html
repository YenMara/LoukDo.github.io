<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/order.css" />
  </head>
  <body>
     <header class="position-absolute top-0 start-0 w-100 z-3">
       <div id="navbar"></div>
    </header>


    <section>
    <div class="container section-4 mt-7">

        <h2 class="primary-color mb-4">Shopping Cart</h2>

        <div class="row g-4">

            <!-- Shopping Cart -->
            <div class="col-lg-8">

                <div class="rounded-4 shadows p-3">
                    <div id="cart-items-container"></div>
                </div>

            </div>

            <!-- Summary -->
            <div class="col-lg-4">

                <div class="rounded-4 shadows p-4">

                    <h3 class="primary-color">
                        Order Summary
                    </h3>

                    <div class="d-flex justify-content-between mt-3">
                        <p class="fw-normal">Subtotal</p>
                        <h5 id="cart-subtotal" class="secondary-color">$0.00</h5>
                    </div>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Shipping</p>
                        <h5 class="secondary-color">$1.00</h5>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Total</p>
                        <h5 id="cart-total" class="secondary-color">$0.00</h5>
                    </div>

             <a href="checkout.html" class="text-decoration-none">
                         <button
                type="submit"
                class="btn btn-outline-secondary-color secondary-color rounded-4 w-100"
            >
                Proceed to checkout
            </button>
             </a>

             <a href="products.html" class="text-decoration-none">
                <button
                type="submit"
                class="btn btn-outline-primary-color primary-color rounded-4 w-100 mt-3"
            >
               Continue Shopping
            </button>
             </a>
                      

                </div>

            </div>

        </div>

    </div>
</section>

<footer class="mt-6">
       <div id="footer"></div>
      
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/js/order.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const lastOrder = localStorage.getItem('loukdo-last-order');
        if (lastOrder) {
          try {
            const order = JSON.parse(lastOrder);
            const container = document.getElementById('cart-items-container');
            if (container && order.items && order.items.length > 0) {
              let subtotal = 0;
              const markup = order.items.map((item, index) => {
                const price = Number(item.price) || 0;
                const qty = Number(item.quantity) || 1;
                const lineTotal = price * qty;
                subtotal += lineTotal;
                return `
                  <div class="row align-items-center mt-3">
                    <div class="col-lg-4 col-md-5 col-12 text-center mb-3 mb-md-0">
                      <div class="img-shoppingcart mx-auto">
                        <div class="w-100 h-100 rounded-4 d-flex align-items-center justify-content-center bg-light">
                          <i class="fa-solid fa-box text-muted" style="font-size: 3rem;"></i>
                        </div>
                      </div>
                    </div>
                    <div class="col-lg-8 col-md-7 col-12">
                      <div class="d-flex justify-content-between align-items-start flex-wrap">
                        <div>
                          <h3 class="primary-color">${item.name}</h3>
                          <p class="fw-normal mb-3">Ordered Item</p>
                        </div>
                      </div>
                      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <div class="quantity-box">
                          <span class="px-3">Qty: ${qty}</span>
                        </div>
                        <div class="text-lg-end">
                          <p class="mb-1 fw-normal">$${price.toFixed(2)} each</p>
                          <h3 class="primary-color">$${lineTotal.toFixed(2)}</h3>
                        </div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('');

              container.innerHTML = `
                <div class="text-center py-4 mb-3">
                  <i class="fa-solid fa-circle-check text-success" style="font-size: 3rem;"></i>
                  <h4 class="primary-color mt-3">Order Placed Successfully!</h4>
                  <p class="fw-normal">Thank you for your purchase. Your order has been confirmed.</p>
                </div>
                <hr>
                <h5 class="primary-color">Order Details</h5>
                ${markup}
              `;

              const subtotalElement = document.getElementById('cart-subtotal');
              const totalElement = document.getElementById('cart-total');
              const shippingCost = 1;
              if (subtotalElement) subtotalElement.textContent = `$${subtotal.toFixed(2)}`;
              if (totalElement) totalElement.textContent = `$${(subtotal + shippingCost).toFixed(2)}`;
            }
          } catch (e) {
            console.error('Failed to load order', e);
          }
        }
      });
    </script>

      <script src="/JS/components.js"></script>
  </body>
</html>
