<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout-Payment method</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/contact.css" />
    <link rel="stylesheet" href="/CSS/checkout.css">
    <link rel="stylesheet" href="/CSS/paybyQR.css">
     <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

  </head>
  <body>
     <header class="position-absolute top-0 start-0 w-100 z-3">
       <div id="navbar"></div>
    </header>

    <section  data-aos="fade-up"
     data-aos-anchor-placement="center-bottom">
      <div class="container mt-5 mb-5">
        <h1 class="primary-color">Checkout</h1>

       <div class="checkout-stepper mt-3">

                    <!-- Step 1 -->
                    <div class="step">
                        <a href="checkout.html" class="text-decoration-none">
                            <div class="circle">1</div>
                        <p class="fw-normal">Shipping</p>
                        </a>
                    </div>

                    <div class="line"></div>

                    <!-- Step 2 -->
                    <div class="step active">
                        <a href="checkout1.html" class="text-decoration-none ms-5">
                            <div class="circle">2</div>
                        <p class="fw-normal">Payment</p>
                        </a>
                    </div>

                    <div class="line"></div>

                    <!-- Step 3 -->
                    <div class="step">
                        <a href="checkout2.html" class="text-decoration-none ms-5">
                            <div class="circle">3</div>
                        <p class="fw-normal">Review</p>
                        </a>
                    </div>

                </div>
      </div>
    </section>



    <section  data-aos="fade-up"
     data-aos-anchor-placement="center-bottom">
      <div class="container">
        <div class="row g-3">
          <div class="col-12 col-lg-8 col-md-6">
            <div class="shadows rounded-4 p-4">
              <h2 class="primary-color mb-4">Payment Method</h2>

              <form>
                 <a href="checkout1.html" class="text-decoration-none btn btn-outline-secondary primary-color rounded-4 text-start ps-5 w-100 mt-4">
                <i class="fa-solid fa-credit-card"></i>
                 Credit/Debit Card
              </a>
                 <a href="paybyQR.html" class="text-decoration-none btn btn-outline-secondary primary-color rounded-4 text-start ps-5 w-100 mt-4 active">
               <i class="fa-solid fa-qrcode"></i>
                 KHQR
              </a>
                 <a href="cashondelivery.html" class="text-decoration-none btn btn-outline-secondary primary-color rounded-4 text-start ps-5 w-100 mt-4">
               <i class="fa-regular fa-money-bill-1"></i>
                 Cash on Delivery
              </a>
                 
              <div class="bg-qr mt-3">
                <img src="/images/qr.png" alt="" class="w-100 h-100">
              </div>


              <button id="qr-continue-btn" type="button" class="text-decoration-none btn btn-outline-secondary-color secondary-color rounded-4 px-4 w-100 my-4">
                  Continue
               </button>
              </form>
            </div>
          </div>
          <div class="col-sm-12 col-lg-4 col-md-6">
            <div class="rounded-4 shadows p-4">

                    <h3 class="primary-color">
                        Order Summary
                    </h3>

                    <div class="d-flex justify-content-between mt-3">
                        <p class="fw-normal">Subtotal</p>
                        <h5 class="secondary-color">$40.98</h5>
                    </div>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Shipping</p>
                        <h5 class="secondary-color">$1.00</h5>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <p class="fw-normal">Total</p>
                        <h5 class="secondary-color">$41.98</h5>
                    </div>

            

                </div>
          </div>
        </div>
      </div>
    </section>


     <footer class="mt-6" data-aos="fade-up"
     data-aos-anchor-placement="top-bottom">
       <div id="footer"></div>
      
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/JS/components.js"></script>

    <script src="/JS/paybyQR.js"></script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
  AOS.init({
    duration: 1000,
    once: false,
    mirror: true
  });
</script>
  </body>
</html>
