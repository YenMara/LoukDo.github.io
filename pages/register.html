<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/CSS/brand.css" />
    <link rel="stylesheet" href="/CSS/login.css" />
  </head>
  <body>
    <header class="position-absolute top-0 start-0 w-100 z-3">
       <div id="navbar"></div>
    </header>

    <section>
      <div class="container">
        <form action="" class="shadows p-4 rounded-4 mt-7">
          <div class="text-center">
            <div
              class="log-icon rounded-5 btn-outline-secondary-color text-center pt-3 m-auto"
            >
              <i class="fa-solid fa-arrow-right-to-bracket secondary-color"></i>
            </div>
            <h2 class="primary-color">Create Account</h2>
            <p class="fw-normal">Join LoukDo today</p>
          </div>
          <div class="mb-3">
            <label for="exampleInputName" class="form-label primary-color">
              Full Name
            </label>
            <input
              type="name"
              class="form-control rounded-4 mt-0"
              id="exampleInputName"
              placeholder="Enter your full name"
            />
          </div>
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label primary-color">
              Your Email
            </label>
            <input
              type="email"
              class="form-control rounded-4 mt-0"
              id="exampleInputEmail1"
              placeholder="Enter your email"
            />
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword" class="form-label primary-color">
              Password
            </label>
            <input
              type="password"
              class="form-control rounded-4 mt-0"
              id="exampleInputPassword"
              placeholder="Enter your password"
            />
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword" class="form-label primary-color">
              Confirm Password
            </label>
            <input
              type="password"
              class="form-control rounded-4 mt-0"
              id="exampleInputConfirmPassword"
              placeholder="Enter your confirm password"
            />
          </div>
          <div class="d-flex fs-7">
            <div class="mb-3 form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="exampleCheck1"
              />
              <label class="form-check-label fw-normal me-1" for="exampleCheck1"
                >I agree to the</label
              >
            </div>
            <a href="" class="text-decoration-none">
              <p class="fw-normal text-danger me-1">Terms and Conditions</p>
            </a>
            <p class="fw-normal me-1">and</p>
            <a href="" class="text-decoration-none">
              <p class="fw-normal text-danger">Privacy Policy</p>
            </a>
          </div>

          <a
          href="index.html"
            type="submit"
            class="btn btn-outline-secondary-color secondary-color rounded-4 px-4 w-100"
          >
            Sign up
          </a>

          <div class="d-flex mt-3 ms-5">
            <p class="fw-normal me-1 ms-3">Already have an account?</p>
            <a href="login.html" class="text-decoration-none">
              <p class="fw-normal text-danger">Sign in</p>
            </a>
          </div>

          
      </div>
    </section>


     <footer class="mt-6">
       <div id="footer"></div>
      
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

      <script src="/JS/components.js"></script>
  </body>
</html>
